<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CustomAOV - Đăng nhập & Đăng ký</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e293b;
      padding: 28px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h2 { margin-top: 0; text-align: center; color: #38bdf8; }
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #334155;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: #94a3b8;
      font-weight: bold;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #38bdf8;
      border-bottom: 2px solid #38bdf8;
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    button.submit-btn {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button.submit-btn:hover { background: #0369a1; }
    button.logout-btn {
      background: #ef4444;
      margin-top: 15px;
    }
    .hidden { display: none; }
    #message {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
    }
    .msg-error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
    .msg-success { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid #22c55e; }
    .profile-card {
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #334155;
      font-size: 14px;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>CUSTOM AOV</h2>

    <!-- KHỐI CHƯA ĐĂNG NHẬP -->
    <div id="auth-section">
      <div class="tabs">
        <button class="tab-btn active" id="tab-login">Đăng nhập</button>
        <button class="tab-btn" id="tab-register">Đăng ký</button>
      </div>

      <!-- FORM ĐĂNG NHẬP -->
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="nhapemail@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="login-password" placeholder="Tối thiểu 6 ký tự" required>
        </div>
        <button type="submit" class="submit-btn">Đăng nhập</button>
      </form>

      <!-- FORM ĐĂNG KÝ -->
      <form id="register-form" class="hidden">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="nhapemail@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu (tối thiểu 6 ký tự)</label>
          <input type="password" id="reg-password" minlength="6" placeholder="••••••" required>
        </div>
        <div class="form-group">
          <label>Tên Ingame Liên Quân</label>
          <input type="text" id="reg-ingame" placeholder="VD: FL.ADC" required>
        </div>
        <div class="form-group">
          <label>Rank hiện tại</label>
          <select id="reg-rank">
            <option value="Tinh Anh">Tinh Anh</option>
            <option value="Cao Thủ" selected>Cao Thủ</option>
            <option value="Đại Cao Thủ">Đại Cao Thủ</option>
            <option value="Chiến Tướng">Chiến Tướng</option>
            <option value="Chiến Thần">Chiến Thần</option>
            <option value="Thách Đấu">Thách Đấu</option>
          </select>
        </div>
        <button type="submit" class="submit-btn">Tạo tài khoản</button>
      </form>
    </div>

    <!-- KHỐI ĐÃ ĐĂNG NHẬP (HIỂN THỊ PROFILE) -->
    <div id="user-section" class="hidden">
      <div class="profile-card">
        <div><strong>Email:</strong> <span id="p-email"></span></div>
        <div><strong>Tên hiển thị:</strong> <span id="p-display"></span></div>
        <div><strong>Vai trò:</strong> <span id="p-role"></span></div>
        <hr style="border-color: #334155;">
        <div><strong>Tên Ingame:</strong> <span id="p-ingame" style="color: #38bdf8; font-weight: bold;"></span></div>
        <div><strong>Rank:</strong> <span id="p-rank"></span></div>
        <div><strong>Điểm MMR hệ thống:</strong> <span id="p-mmr"></span></div>
      </div>
      <button id="btn-logout" class="submit-btn logout-btn">Đăng xuất</button>
    </div>

    <!-- THÔNG BÁO TRẠNG THÁI -->
    <div id="message" class="hidden"></div>
  </div>

  <!-- LOGIC SUPABASE AUTH -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    // 1. Khởi tạo Supabase với URL và Publishable Key của bạn
    const SUPABASE_URL = 'https://mbgiwrocfacxianindfp.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_by1AFTB0JOce8OqBlVEOEw__9fYSa7z'
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

    // Các phần tử DOM
    const tabLogin = document.getElementById('tab-login')
    const tabRegister = document.getElementById('tab-register')
    const loginForm = document.getElementById('login-form')
    const registerForm = document.getElementById('register-form')
    const authSection = document.getElementById('auth-section')
    const userSection = document.getElementById('user-section')
    const msgBox = document.getElementById('message')

    // Hàm hiển thị thông báo
    function showMessage(text, isError = false) {
      msgBox.textContent = text
      msgBox.className = isError ? 'msg-error' : 'msg-success'
      msgBox.classList.remove('hidden')
    }

    // Chuyển đổi qua lại giữa tab Đăng nhập và Đăng ký
    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active')
      tabRegister.classList.remove('active')
      loginForm.classList.remove('hidden')
      registerForm.classList.add('hidden')
      msgBox.classList.add('hidden')
    })

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active')
      tabLogin.classList.remove('active')
      registerForm.classList.remove('hidden')
      loginForm.classList.add('hidden')
      msgBox.classList.add('hidden')
    })

    // 2. XỬ LÝ ĐĂNG KÝ (SIGN UP)
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault()
      showMessage('Đang xử lý đăng ký...', false)

      const email = document.getElementById('reg-email').value.trim()
      const password = document.getElementById('reg-password').value
      const ingameName = document.getElementById('reg-ingame').value.trim()
      const currentRank = document.getElementById('reg-rank').value

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          // Dữ liệu này sẽ được Trigger handle_new_user() trong SQL tự động lưu vào bảng profiles & game_profiles
          data: {
            display_name: ingameName,
            ingame_name: ingameName,
            current_rank: currentRank
          }
        }
      })

      if (error) {
        showMessage('Lỗi đăng ký: ' + error.message, true)
        return
      }

      showMessage('Đăng ký thành công!')
      await loadUserProfile()
    })

    // 3. XỬ LÝ ĐĂNG NHẬP (SIGN IN)
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault()
      showMessage('Đang đăng nhập...', false)

      const email = document.getElementById('login-email').value.trim()
      const password = document.getElementById('login-password').value

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      })

      if (error) {
        showMessage('Sai tài khoản hoặc mật khẩu: ' + error.message, true)
        return
      }

      msgBox.classList.add('hidden')
      await loadUserProfile()
    })

    // 4. XỬ LÝ ĐĂNG XUẤT (SIGN OUT)
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      authSection.classList.remove('hidden')
      userSection.classList.add('hidden')
      showMessage('Đã đăng xuất.')
    })

    // 5. LẤY DỮ LIỆU TỪ BẢNG PROFILES & GAME_PROFILES HIỂN THỊ LÊN GIAO DIỆN
    async function loadUserProfile() {
      const { data: { user } } = await supabase.auth.getUser()
      if (!user) {
        authSection.classList.remove('hidden')
        userSection.classList.add('hidden')
        return
      }

      // Truy vấn dữ liệu từ bảng profiles và nối sang bảng game_profiles
      const { data: profile, error } = await supabase
        .from('profiles')
        .select(`
          display_name,
          role,
          game_profiles (
            ingame_name,
            current_rank,
            system_mmr
          )
        `)
        .eq('id', user.id)
        .single()

      if (error) {
        showMessage('Đã đăng nhập nhưng chưa lấy được Profile: ' + error.message, true)
        return
      }

      // Gán dữ liệu vào thẻ HTML (game_profiles có thể trả về dạng Object hoặc mảng 1 phần tử tùy cấu hình FK)
      const gameInfo = Array.isArray(profile.game_profiles) ? profile.game_profiles[0] : profile.game_profiles

      document.getElementById('p-email').textContent = user.email
      document.getElementById('p-display').textContent = profile.display_name || 'Chưa đặt'
      document.getElementById('p-role').textContent = profile.role
      document.getElementById('p-ingame').textContent = gameInfo?.ingame_name || 'Chưa cập nhật'
      document.getElementById('p-rank').textContent = gameInfo?.current_rank || 'Unranked'
      document.getElementById('p-mmr').textContent = gameInfo?.system_mmr ?? 1000

      authSection.classList.add('hidden')
      userSection.classList.remove('hidden')
    }

    // Tự động kiểm tra phiên đăng nhập khi vừa mở trang
    loadUserProfile()
  </script>
</body>
</html>
